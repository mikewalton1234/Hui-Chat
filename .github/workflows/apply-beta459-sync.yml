name: Apply beta.459 source sync

on:
  push:
    branches:
      - agent/add-multi-agent-review
    paths:
      - _sync_core/READY
  pull_request:
    branches:
      - main
    paths:
      - _sync_core/READY

permissions:
  contents: write

concurrency:
  group: hui-beta459-source-sync
  cancel-in-progress: false

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-multi-agent-review
          fetch-depth: 0

      - name: Reconstruct and verify sync payloads
        shell: bash
        run: |
          set -euo pipefail
          cat _sync_core/part-* | base64 --decode > "$RUNNER_TEMP/hui-sync.tar.xz"
          echo "291328c57506d385f5a26d91ce4bcb18ba8d1408c7222a23481bce7b56e0d2d1  $RUNNER_TEMP/hui-sync.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hui-sync"
          tar -xJf "$RUNNER_TEMP/hui-sync.tar.xz" -C "$RUNNER_TEMP/hui-sync"
          echo "f2d40f48b38d33b7866107670a828e7a274c9a31b45140916df28555070b1aca  $RUNNER_TEMP/hui-sync/core_sync.patch" | sha256sum -c -

          base64 --decode _sync_core/final-extra.b64 > "$RUNNER_TEMP/hui-final.patch.xz"
          echo "be91ca112f659d52889516319e6d6ecb35b845ae367382ca360bd1baad7bf02a  $RUNNER_TEMP/hui-final.patch.xz" | sha256sum -c -
          xz --decompress --stdout "$RUNNER_TEMP/hui-final.patch.xz" > "$RUNNER_TEMP/hui-final.patch"
          echo "89839dc2a6b2bb1db639f7c7602ad605427c827247f2639abd9e07aea1c14877  $RUNNER_TEMP/hui-final.patch" | sha256sum -c -

      - name: Apply audited beta.459 production tree
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/hui-sync/core_sync.patch"
          git apply --whitespace=nowarn "$RUNNER_TEMP/hui-sync/core_sync.patch"
          while IFS= read -r path; do
            [[ -n "$path" ]] && rm -rf -- "$path"
          done < "$RUNNER_TEMP/hui-sync/core_delete.txt"

          git apply --check "$RUNNER_TEMP/hui-final.patch"
          git apply --whitespace=nowarn "$RUNNER_TEMP/hui-final.patch"

          rm -rf _sync_core _sync_payload .github/hui-sync
          rm -f .github/workflows/export-source-snapshot.yml
          rm -f .github/workflows/apply-beta459-sync.yml
          rm -f _another_probe.txt _cleanup_me.txt _ignore.txt _last_probe.txt
          rm -f _stop_probe.txt _sync_probe.txt _sync_test_base.txt

      - name: Verify version and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION.txt)" = "0.11.0-beta.459"
          python -m compileall -q .
          if command -v node >/dev/null 2>&1; then
            find static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          fi

      - name: Verify runtime timing consistency
        run: python tools/runtime_timing_consistency_doctor.py

      - name: Verify production configuration guard
        run: python tools/production_config_guard_doctor.py

      - name: Verify installation and upgrade flow
        run: python tools/server_installation_doctor.py

      - name: Verify deployment operations
        run: python tools/deployment_ops_doctor.py

      - name: Verify deep systemd deployment
        run: python tools/deployment_ops_deep_doctor.py

      - name: Verify realtime authorization
        run: python tools/realtime_auth_doctor.py

      - name: Verify moderation and timed IP bans
        run: python tools/moderation_doctor.py

      - name: Verify multi-agent review configuration
        run: python tools/multi_agent_review_doctor.py

      - name: Verify transfer cleanup
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            _sync_core _sync_payload .github/hui-sync \
            _sync_probe.txt _sync_test_base.txt _another_probe.txt \
            _stop_probe.txt _last_probe.txt _ignore.txt _cleanup_me.txt \
            .github/workflows/export-source-snapshot.yml \
            .github/workflows/apply-beta459-sync.yml; do
            test ! -e "$path"
          done

      - name: Commit synchronized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hui Chat Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Sync beta.459 production setup hardening"
          git push origin HEAD:agent/add-multi-agent-review
