name: Temporary source snapshot

on:
  push:
    branches:
      - agent/add-multi-agent-review

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Create source archive
        run: |
          tar \
            --exclude=.git \
            --exclude=.github/workflows/export-source-snapshot.yml \
            -czf "$RUNNER_TEMP/hui-branch-source.tar.gz" .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: hui-branch-source-${{ github.sha }}
          path: ${{ runner.temp }}/hui-branch-source.tar.gz
          if-no-files-found: error
          retention-days: 1
